<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>身體自主管理 V1.12</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyB_Qn0ElE6ypUy5faN2R8QjgBPdZm15-c0",
  authDomain: "fitness-tracker-9cbc2.firebaseapp.com",
  projectId: "fitness-tracker-9cbc2",
  storageBucket: "fitness-tracker-9cbc2.firebasestorage.app",
  messagingSenderId: "753814249481",

};

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Helvetica Neue',sans-serif;background:#f0ede8;color:#1a1a1a;min-height:100vh;max-width:480px;margin:0 auto;}
:root{--bg:#f0ede8;--card:#fff;--card2:#f7f4f0;--border:#e0dbd3;--text:#1a1a1a;--sub:#888;--sub2:#bbb;--gym:#3b82f6;--cardio:#f97316;--strength:#22c55e;--accent:#7c3aed;--al:#ede9fe;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;position:sticky;top:0;background:#f0ede8;z-index:100;border-bottom:1px solid var(--border);}
.app-title{font-size:16px;font-weight:800;color:var(--text);}
.app-ver{font-size:10px;color:var(--sub);margin-left:6px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;margin-left:8px;vertical-align:middle;}
.sync-dot.ok{background:var(--strength);}
.sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite;}
.sync-dot.err{background:#ef4444;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.user-switch{display:flex;gap:6px;}
.ubtn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.ubtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tabs{display:flex;padding:8px 16px;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:53px;background:#f0ede8;z-index:99;border-bottom:1px solid var(--border);}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.page{display:none;padding:14px 16px 80px;}
.page.active{display:block;}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border);}
.sec-label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:1px;margin:18px 0 8px;text-transform:uppercase;}
.pickers-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pf{background:var(--card2);border-radius:12px;padding:10px;}
.pl{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:6px;}
.drum-wrap{position:relative;height:120px;overflow:hidden;border-radius:8px;background:#fff;border:1px solid var(--border);}
.drum-scroll{height:120px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;}
.drum-scroll::-webkit-scrollbar{display:none;}
.drum-pad{height:40px;}
.drum-item{height:40px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:15px;font-weight:600;color:var(--sub2);}
.drum-item.sel{color:var(--accent);font-size:20px;}
.dft{position:absolute;top:0;left:0;right:0;height:36px;background:linear-gradient(to bottom,#fff 60%,transparent);pointer-events:none;}
.dfb{position:absolute;bottom:0;left:0;right:0;height:36px;background:linear-gradient(to top,#fff 60%,transparent);pointer-events:none;}
.dl{position:absolute;top:40px;left:6px;right:6px;height:40px;border-top:1.5px solid var(--al);border-bottom:1.5px solid var(--al);pointer-events:none;}
.pv{text-align:center;font-size:14px;font-weight:800;color:var(--accent);margin-top:6px;}
.ex-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.ex-btn{padding:16px 8px;border-radius:14px;border:2px solid var(--border);background:var(--card2);color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.2s;line-height:1.6;}
.ex-btn span{display:block;font-size:22px;margin-bottom:4px;}
.ag{background:#dbeafe;border-color:var(--gym);color:var(--gym);}
.ac{background:#ffedd5;border-color:var(--cardio);color:var(--cardio);}
.as{background:#dcfce7;border-color:var(--strength);color:var(--strength);}
.meal-sec{margin-bottom:16px;}
.meal-lbl{font-size:14px;font-weight:800;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.mdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.frow{background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:6px;}
.frow-top{display:flex;justify-content:space-between;align-items:flex-start;}
.frow-name{font-size:14px;font-weight:600;color:var(--text);}
.frow-mac{font-size:12px;color:var(--sub);margin-top:3px;}
.frm{background:none;border:none;color:var(--sub2);font-size:18px;cursor:pointer;padding:0;}
.hist-btn{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card2);color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;}
.hist-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;flex-direction:column;justify-content:flex-end;}
.hist-overlay.show{display:flex;}
.hist-sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px;max-height:60vh;overflow-y:auto;}
.hist-sheet-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:12px;}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.hist-item-name{font-size:14px;font-weight:600;color:var(--text);}
.hist-item-mac{font-size:12px;color:var(--sub);margin-top:2px;}
.hist-add-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.hist-close{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--border);background:transparent;color:var(--sub);font-size:14px;font-weight:600;cursor:pointer;margin-top:12px;}
.add-wrap{background:var(--card2);border-radius:12px;padding:10px;}
.add-wrap input{width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:9px 10px;font-family:inherit;margin-bottom:6px;}
.add-row2{display:flex;gap:6px;}
.add-row2 input{margin-bottom:0;flex:1;}
.add-row2 button{padding:9px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.day-total{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.tbox{background:var(--card2);border-radius:10px;padding:12px;text-align:center;}
.tval{font-size:26px;font-weight:800;color:var(--text);}
.tlbl{font-size:12px;color:var(--sub);margin-top:2px;}
.save-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px;}
.save-msg{text-align:center;font-size:13px;color:var(--strength);margin-top:8px;display:none;font-weight:700;}
.today-hdr{text-align:center;padding:6px 0 14px;}
.today-date{font-size:13px;color:var(--sub);}
.today-name{font-size:22px;font-weight:800;color:var(--text);margin-top:2px;}
.tsec{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.tempty{font-size:13px;color:var(--sub2);padding:10px 0;}
.ex-tag{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-right:6px;margin-bottom:6px;}
.tg{background:#dbeafe;color:var(--gym);}
.tc2{background:#ffedd5;color:var(--cardio);}
.ts2{background:#dcfce7;color:var(--strength);}
.ftody{padding:8px 0;border-bottom:1px solid var(--border);}
.ftody-top{display:flex;justify-content:space-between;align-items:flex-start;}
.ftody-name{font-size:14px;font-weight:600;color:var(--text);}
.ftody-mac{font-size:12px;color:var(--sub);margin-top:2px;}
.ftody-rm{background:none;border:none;color:var(--sub2);font-size:16px;cursor:pointer;padding:0;}
.btody-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btody-box{background:var(--card2);border-radius:10px;padding:10px;}
.btody-lbl{font-size:11px;color:var(--sub);}
.btody-val{font-size:18px;font-weight:800;color:var(--text);margin-top:2px;}
.cal-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month-nav{display:flex;gap:8px;align-items:center;}
.cal-nav-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:#fff;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-month-lbl{font-size:15px;font-weight:800;color:var(--text);min-width:90px;text-align:center;}
.cal-legend{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
.cal-leg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);font-weight:600;}
.cal-leg-dot{width:10px;height:10px;border-radius:50%;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{font-size:10px;color:var(--sub2);text-align:center;padding:3px 0;font-weight:700;}
.cal-day{aspect-ratio:1;border-radius:10px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--sub2);border:1.5px solid transparent;}
.cal-day.tod{border-color:var(--accent);color:var(--accent);font-weight:800;}
.cal-day.hex{color:var(--text);font-weight:600;}
.cal-day.future{opacity:0.35;}
.cal-dots{display:flex;gap:3px;margin-top:3px;}
.cal-dot{width:7px;height:7px;border-radius:50%;}
.bchange-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border);}
.bc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.bc-title{font-size:14px;font-weight:700;color:var(--text);}
.bc-big{font-size:32px;font-weight:800;color:var(--text);line-height:1;}
.bc-unit{font-size:14px;color:var(--sub);font-weight:400;margin-left:2px;}
.bc-zone{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-top:4px;}
.zone-low{background:#dbeafe;color:#1d4ed8;}
.zone-std{background:#dcfce7;color:#15803d;}
.zone-high{background:#fee2e2;color:#dc2626;}
.ruler-wrap{margin:10px 0 4px;}
.ruler-bar{position:relative;height:20px;border-radius:10px;overflow:visible;}
.ruler-segs{display:flex;height:100%;border-radius:10px;overflow:hidden;}
.seg-low{background:#93c5fd;flex-shrink:0;}
.seg-std{background:#86efac;flex-shrink:0;}
.seg-high{background:#fca5a5;flex-shrink:0;}
.ruler-marker{position:absolute;top:-4px;width:12px;height:28px;border-radius:6px;background:var(--accent);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.25);transform:translateX(-50%);transition:left 0.4s;}
.ruler-labels{display:flex;justify-content:space-between;margin-top:4px;}
.ruler-lbl{font-size:10px;color:var(--sub);}
.bc-trend{font-size:12px;color:var(--sub);margin-top:4px;}
.bc-trend.up{color:#ef4444;}
.bc-trend.down{color:#22c55e;}
.tgroup-title{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px;}
.period-row{display:flex;gap:6px;margin-bottom:14px;}
.pbtn{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--sub);font-size:13px;font-weight:600;cursor:pointer;}
.pbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.bstat{background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.bstat-lbl{font-size:13px;color:var(--sub);}
.bstat-val{font-size:26px;font-weight:800;color:var(--text);}
.bstat-unit{font-size:13px;color:var(--sub);margin-left:2px;}
.srow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
.slbl{color:var(--sub);}
.sval{font-weight:700;color:var(--text);}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#f0ede8;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;}
.loading-spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div style="font-size:14px;color:var(--sub);font-weight:600;">連接雲端資料庫...</div>
</div>

<div class="topbar">
  <div>
    <span class="app-title">身體自主管理</span>
    <span class="app-ver">V1.12</span>
    <span class="sync-dot" id="sync-dot" title="雲端同步狀態"></span>
  </div>
  <div class="user-switch">
    <button class="ubtn active" onclick="switchUser('A')" id="btn-A">Aben</button>
    <button class="ubtn" onclick="switchUser('D')" id="btn-D">Debby</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showPage('record',this)">📝 記錄</button>
  <button class="tab" onclick="showPage('today',this)">📋 今日</button>
  <button class="tab" onclick="showPage('calendar',this)">🏃 運動月曆</button>
  <button class="tab" onclick="showPage('trend',this)">📈 身體變化</button>
  <button class="tab" onclick="showPage('stats',this)">🍱 飲食紀錄</button>
</div>

<div id="page-record" class="page active">
  <div class="sec-label">身體數據 <span style="font-size:11px;color:var(--sub2);font-weight:400;text-transform:none;">（量了再填）</span></div>
  <div class="card">
    <div class="pickers-grid" id="body-pickers"></div>
    <button class="save-btn" onclick="saveBodyData()">儲存身體數據</button>
    <div id="body-save-msg" class="save-msg">✓ 身體數據已儲存！</div>
  </div>
  <div class="sec-label">今日運動</div>
  <div class="card">
    <div class="ex-grid">
      <button class="ex-btn" id="ex-gym" onclick="toggleEx('gym')"><span>🏋️</span>健身房</button>
      <button class="ex-btn" id="ex-cardio" onclick="toggleEx('cardio')"><span>🏃</span>有氧</button>
      <button class="ex-btn" id="ex-strength" onclick="toggleEx('strength')"><span>💪</span>肌力</button>
    </div>
    <button class="save-btn" onclick="saveExercise()">儲存運動紀錄</button>
    <div id="ex-save-msg" class="save-msg">✓ 運動紀錄已儲存！</div>
  </div>
  <div class="sec-label">今日飲食</div>
  <div class="card" id="meal-blocks"></div>
</div>

<div id="page-today" class="page">
  <div class="today-hdr">
    <div class="today-date" id="t-date"></div>
    <div class="today-name" id="t-name"></div>
  </div>
  <div class="card"><div class="tsec">運動</div><div id="t-ex"></div></div>
  <div class="card"><div class="tsec">飲食</div><div id="t-food"></div></div>
  <div class="card"><div class="tsec">身體數據</div><div id="t-body"></div></div>
</div>

<div id="page-calendar" class="page">
  <div class="cal-controls">
    <div class="cal-month-nav">
      <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
      <div class="cal-month-lbl" id="cal-month-lbl"></div>
      <button class="cal-nav-btn" onclick="calNav(1)">›</button>
    </div>
  </div>
  <div class="cal-legend">
    <div class="cal-leg"><div class="cal-leg-dot" style="background:var(--gym)"></div>健身房</div>
    <div class="cal-leg"><div class="cal-leg-dot" style="background:var(--cardio)"></div>有氧</div>
    <div class="cal-leg"><div class="cal-leg-dot" style="background:var(--strength)"></div>肌力</div>
  </div>
  <div class="card" style="padding:12px;">
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<div id="page-trend" class="page"><div id="trend-content"></div></div>

<div id="page-stats" class="page">
  <div class="period-row">
    <button class="pbtn active" onclick="setPeriod('today',this)">今日</button>
    <button class="pbtn" onclick="setPeriod('week',this)">本週</button>
    <button class="pbtn" onclick="setPeriod('month',this)">本月</button>
  </div>
  <div id="stats-content"></div>
</div>

<div class="hist-overlay" id="hist-overlay" onclick="closeHist(event)">
  <div class="hist-sheet" id="hist-sheet">
    <div class="hist-sheet-title">常用食物</div>
    <div id="hist-list"></div>
    <button class="hist-close" onclick="closeHistBtn()">關閉</button>
  </div>
</div>

<script>
let CU='A', SP='today';
let mealData=[[],[],[]], exState={gym:false,cardio:false,strength:false}, bodyInputs={};
let tCharts=[], histTargetMeal=0;
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();
let localCache={A:{daily:{},body:[],foodHist:[]},D:{daily:{},body:[],foodHist:[]}};

const MEALS=['早餐','午餐','晚餐'], MC=['#f59e0b','#3b82f6','#a78bfa'];
const BF=[
  {key:'weight',    label:'體重',        unit:'kg',  min:0,max:250,step:0.1,dec:1,def:{A:88.6,D:58.1}},
  {key:'muscle',    label:'骨骼肌重',    unit:'kg',  min:0,max:200,step:0.1,dec:1,def:{A:32.2,D:22.7}},
  {key:'fat_mass',  label:'脂肪重',      unit:'kg',  min:0,max:200,step:0.1,dec:1,def:{A:30.9,D:17.4}},

  {key:'fat_pct',   label:'體脂率',      unit:'%',   min:0,max:100,step:0.1,dec:1,def:{A:34.8,D:29.9}},
  {key:'waist_hip', label:'腰臀比',      unit:'',    min:0,max:3,  step:0.01,dec:2,def:{A:1.03,D:0.84}},
  {key:'vis_lvl',   label:'內臟脂肪程度',unit:'',    min:0,max:30, step:1,  dec:0,def:{A:13,D:7}},
  {key:'vis_area',  label:'內臟脂肪面積',unit:'cm²', min:0,max:500,step:1,  dec:0,def:{A:188,D:49}},
];

function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function setSyncDot(s){const d=document.getElementById('sync-dot');d.className='sync-dot '+s;}

// ── FIREBASE DB ──
async function dbSet(path, data){
  try{
    setSyncDot('syncing');
    await window._setDoc(window._doc(window._db, ...path.split('/')), data, {merge:true});
    setSyncDot('ok');
    return true;
  }catch(e){setSyncDot('err');console.error(e);return false;}
}

async function dbGet(path){
  try{
    const snap = await window._getDoc(window._doc(window._db, ...path.split('/')));
    return snap.exists() ? snap.data() : null;
  }catch(e){console.error(e);return null;}
}

async function dbGetAll(collPath){
  try{
    const snap = await window._getDocs(window._collection(window._db, ...collPath.split('/')));
    const result = [];
    snap.forEach(d => result.push({id: d.id, ...d.data()}));
    return result;
  }catch(e){console.error(e);return [];}
}

// ── DATA ──
function getTodayRec(){
  const t=todayStr();
  return localCache[CU].daily[t] || {date:t,exercise:{gym:false,cardio:false,strength:false},meals:[[],[],[]]};
}

async function saveTodayRec(rec){
  localCache[CU].daily[rec.date]=rec;
  await dbSet(`users/${CU}/daily/${rec.date}`, rec);
}

function getBodyRecs(){return localCache[CU].body||[];}

async function saveBodyRec(rec){
  const all=getBodyRecs();
  const idx=all.findIndex(r=>r.date===rec.date);
  if(idx>=0)all[idx]=rec; else all.push(rec);
  localCache[CU].body=all;
  await dbSet(`users/${CU}/body/${rec.date}`, rec);
}

function getFoodHist(){return localCache[CU].foodHist||[];}

async function addFoodHist(f){
  const h=getFoodHist();
  if(!h.find(x=>x.name===f.name)){
    h.unshift(f);
    if(h.length>50)h.pop();
    localCache[CU].foodHist=h;
    await dbSet(`users/${CU}/meta/foodHist`, {items:h});
  }
}

async function loadUserData(u){
  setSyncDot('syncing');
  try{
    // Load daily records
    const daily = await dbGetAll(`users/${u}/daily`);
    localCache[u].daily={};
    daily.forEach(r=>localCache[u].daily[r.date]=r);
    // Load body records
    const body = await dbGetAll(`users/${u}/body`);
    localCache[u].body=body.sort((a,b)=>a.date.localeCompare(b.date));
    // Load food history
    const meta = await dbGet(`users/${u}/meta/foodHist`);
    localCache[u].foodHist = meta ? (meta.items||[]) : [];
    setSyncDot('ok');
  }catch(e){setSyncDot('err');console.error(e);}
}

// ── INIT ──
async function init(){
  await loadUserData(CU);
  const rec=getTodayRec();
  exState={...rec.exercise};
  mealData=(rec.meals||[[],[],[]]).map(m=>m?[...m]:[]);
  while(mealData.length<3)mealData.push([]);
  buildPickers();updateEx();buildMeals();
}

async function switchUser(u){
  CU=u;
  document.getElementById('btn-A').classList.toggle('active',u==='A');
  document.getElementById('btn-D').classList.toggle('active',u==='D');
  if(!Object.keys(localCache[u].daily).length) await loadUserData(u);
  const rec=getTodayRec();
  exState={...rec.exercise};
  mealData=(rec.meals||[[],[],[]]).map(m=>m?[...m]:[]);
  while(mealData.length<3)mealData.push([]);
  buildPickers();updateEx();buildMeals();
  const ap=document.querySelector('.page.active').id.replace('page-','');
  refresh(ap);
}

function showPage(p,b){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');

function refresh(p){
  if(p==='today')renderToday();
  if(p==='calendar'){calYear=new Date().getFullYear();calMonth=new Date().getMonth();renderCal();}
  if(p==='trend')renderTrend();
  if(p==='stats')renderStats();
}

// ── PICKERS ──
function buildPickers(){
  const wrap=document.getElementById('body-pickers');
  wrap.innerHTML='';
  const last=getBodyRecs().slice(-1)[0];
  BF.forEach(f=>{
    const center=last&&last[f.key]!=null?last[f.key]:f.def[CU];
    bodyInputs[f.key]=center;
    const div=document.createElement('div');
    div.className='pf';
    div.innerHTML=`<div class="pl">${f.label}${f.unit?' ('+f.unit+')':''}</div>
    <div class="drum-wrap"><div class="drum-scroll" id="dr-${f.key}"></div>
    <div class="dft"></div><div class="dl"></div><div class="dfb"></div></div>
    <div class="pv" id="pv-${f.key}">${center.toFixed(f.dec)}</div>`;
    wrap.appendChild(div);
    setTimeout(()=>initDrum(f,center),10);
  });
}

function initDrum(f,center){
  const drum=document.getElementById('dr-'+f.key);if(!drum)return;
  const steps=[];
  for(let v=f.min;v<=f.max+f.step/2;v+=f.step)steps.push(parseFloat(v.toFixed(f.dec)));
  drum.innerHTML='<div class="drum-pad"></div>'+steps.map(v=>`<div class="drum-item" data-v="${v}">${v.toFixed(f.dec)}</div>`).join('')+'<div class="drum-pad"></div>';
  const items=drum.querySelectorAll('.drum-item');
  const ci=steps.findIndex(s=>Math.abs(s-center)<f.step/2);
  if(ci>=0){drum.scrollTop=ci*40;items[ci].classList.add('sel');}
  drum.addEventListener('scroll',()=>{
    const idx=Math.round(drum.scrollTop/40);
    items.forEach((it,i)=>it.classList.toggle('sel',i===idx));
    if(items[idx]){const v=parseFloat(items[idx].dataset.v);bodyInputs[f.key]=v;const el=document.getElementById('pv-'+f.key);if(el)el.textContent=v.toFixed(f.dec);}
  });
}

async function saveBodyData(){
  const r={date:todayStr()};
  BF.forEach(f=>r[f.key]=bodyInputs[f.key]);
  await saveBodyRec(r);
  flash('body-save-msg');
}

function buildMeals(){
  const wrap=document.getElementById('meal-blocks');wrap.innerHTML='';
  MEALS.forEach((meal,mi)=>{
    const sec=document.createElement('div');sec.className='meal-sec';
    sec.innerHTML=`<div class="meal-lbl"><div class="mdot" style="background:${MC[mi]}"></div>${meal}</div>
    <div id="fl-${mi}"></div>
    <button class="hist-btn" onclick="openHist(${mi})">＋ 常用食物</button>
    <div class="add-wrap">
      <input id="fn-${mi}" type="text" placeholder="食物名稱">
      <div class="add-row2">
        <input id="fc-${mi}" type="number" min="0" placeholder="大卡">
        <input id="fp-${mi}" type="number" min="0" placeholder="蛋白質 g">
        <button onclick="addFood(${mi})">新增</button>
      </div>
    </div>`;
    wrap.appendChild(sec);renderFL(mi);
  });
  const tot=document.createElement('div');
  tot.innerHTML=`<div class="day-total">
    <div class="tbox"><div class="tval" id="tcal">0</div><div class="tlbl">大卡</div></div>
    <div class="tbox"><div class="tval" id="tpro">0g</div><div class="tlbl">蛋白質</div></div>
  </div>`;

}

function renderFL(mi){
  const el=document.getElementById('fl-'+mi);if(!el)return;
  el.innerHTML=(mealData[mi]||[]).map((f,fi)=>`
    <div class="frow">
      <div class="frow-top"><div class="frow-name">${f.name}</div><button class="frm" onclick="rmFood(${mi},${fi})">×</button></div>
      <div class="frow-mac">${f.cal||0} 大卡 · 蛋白質 ${f.pro||0}g</div>
    </div>`).join('');
}

async function addFood(mi){
  const n=document.getElementById('fn-'+mi).value.trim();
  const c=Math.max(0,parseFloat(document.getElementById('fc-'+mi).value)||0);
  const p=Math.max(0,parseFloat(document.getElementById('fp-'+mi).value)||0);
  if(!n)return;
  mealData[mi].push({name:n,cal:c,pro:p});
  await addFoodHist({name:n,cal:c,pro:p});
  const r=getTodayRec();r.meals=mealData.map(m=>[...m]);
  await saveTodayRec(r);
  document.getElementById('fn-'+mi).value='';
  document.getElementById('fc-'+mi).value='';
  document.getElementById('fp-'+mi).value='';
  renderFL(mi);updateTotals();
}

async function rmFood(mi,fi){
  mealData[mi].splice(fi,1);
  const r=getTodayRec();r.meals=mealData.map(m=>[...m]);
  await saveTodayRec(r);
  renderFL(mi);updateTotals();
}

function updateTotals(){
  let tc=0,tp=0;
  mealData.forEach(m=>(m||[]).forEach(f=>{tc+=f.cal||0;tp+=f.pro||0;}));
  const ce=document.getElementById('tcal'),pe=document.getElementById('tpro');
  if(ce)ce.textContent=Math.round(tc);
  if(pe)pe.textContent=Math.round(tp)+'g';
}

function openHist(mi){
  histTargetMeal=mi;
  const hist=getFoodHist();
  const list=document.getElementById('hist-list');
  if(!hist.length){list.innerHTML='<div style="color:var(--sub2);font-size:13px;padding:12px 0;">還沒有常用食物，新增幾筆後會出現這裡</div>';}

  document.getElementById('hist-overlay').classList.add('show');
}

async function addFromHist(i){
  const hist=getFoodHist();if(!hist[i])return;
  const f=hist[i];
  mealData[histTargetMeal].push({name:f.name,cal:f.cal||0,pro:f.pro||0});
  const r=getTodayRec();r.meals=mealData.map(m=>[...m]);
  await saveTodayRec(r);
  renderFL(histTargetMeal);updateTotals();closeHistBtn();
}

function closeHist(e){if(e.target===document.getElementById('hist-overlay'))closeHistBtn();}
function closeHistBtn(){document.getElementById('hist-overlay').classList.remove('show');}
function flash(id){const el=document.getElementById(id);if(!el)return;el.style.display='block';setTimeout(()=>el.style.display='none',2000);}

async function rmTodayFood(mi,fi){

function calNav(dir){
  calMonth+=dir;

function renderCalGrid(){
  const grid=document.getElementById('cal-grid');
  grid.innerHTML=['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const firstDay=new Date(calYear,calMonth,1);
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const startDow=firstDay.getDay();
  const ts=todayStr();
  const todayDate=new Date();
  for(let i=0;i<startDow;i++){grid.appendChild(document.createElement('div'));}
  for(let day=1;day<=daysInMonth;day++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const rec=localCache[CU].daily[ds];
    const he=rec&&rec.exercise&&(rec.exercise.gym||rec.exercise.cardio||rec.exercise.strength);
    const isFuture=new Date(calYear,calMonth,day)>todayDate;
    const cell=document.createElement('div');
    cell.className='cal-day'+(ds===ts?' tod':'')+(he?' hex':'')+(isFuture?' future':'');
    let dots='';
    if(he){
      const d=[];
      if(rec.exercise.gym)d.push('<div class="cal-dot" style="background:var(--gym)"></div>');
      if(rec.exercise.cardio)d.push('<div class="cal-dot" style="background:var(--cardio)"></div>');
      if(rec.exercise.strength)d.push('<div class="cal-dot" style="background:var(--strength)"></div>');
      dots=`<div class="cal-dots">${d.join('')}</div>`;
    }
    cell.innerHTML=`<span>${day}</span>${dots}`;
    grid.appendChild(cell);
  }
}

// ── TREND ──
function getZone(key,val){const r=RANGES[CU][key];if(val<r.low)return{zone:'low',label:r.lbl[0]};if(val<=r.std)return{zone:'std',label:r.lbl[1]};return{zone:'high',label:r.lbl[2]};}
function buildRuler(key,val){
  const r=RANGES[CU][key];const max=r.max;
  const lp=(r.low/max)*100,sp=((r.std-r.low)/max)*100,hp=((max-r.std)/max)*100;
  const mp=Math.min(100,Math.max(0,(val/max)*100));
  return `<div class="ruler-wrap"><div class="ruler-bar"><div class="ruler-segs"><div class="seg-low" style="width:${lp}%"></div><div class="seg-std" style="width:${sp}%"></div><div class="seg-high" style="width:${hp}%"></div></div><div class="ruler-marker" style="left:${mp}%"></div></div><div class="ruler-labels"><span class="ruler-lbl">0</span><span class="ruler-lbl">${r.low}</span><span class="ruler-lbl">${r.std}</span><span class="ruler-lbl">${max}</span></div></div>`;
}

function renderTrend(){
  tCharts.forEach(c=>c.destroy());tCharts=[];
  const wrap=document.getElementById('trend-content');wrap.innerHTML='';
  const recs=getBodyRecs().slice(-20);
  const lastRec=recs.slice(-1)[0];const prevRec=recs.slice(-2,-1)[0];
  let ci=0;
  TGROUPS.forEach(grp=>{
    const t=document.createElement('div');t.className='tgroup-title';t.textContent=grp.title;wrap.appendChild(t);
    grp.fields.forEach(fk=>{
      const f=BF.find(x=>x.key===fk);
      const curVal=lastRec?lastRec[fk]:null;const prevVal=prevRec?prevRec[fk]:null;
      const color=COLORS[ci%COLORS.length];ci++;
      const zi=curVal!=null?getZone(fk,curVal):null;
      let trendHTML='';
      if(curVal!=null&&prevVal!=null){const diff=(curVal-prevVal).toFixed(f.dec);const isUp=diff>0;trendHTML=`<div class="bc-trend ${isUp?'up':'down'}">${isUp?'▲':'▼'} ${isUp?'+':''}${diff} ${f.unit}</div>`;}
      const card=document.createElement('div');card.className='bchange-card';
      card.innerHTML=`<div class="bc-header"><div><div class="bc-title">${f.label}</div>${zi?`<span class="bc-zone zone-${zi.zone}">${zi.label}</span>`:'<span class="bc-zone zone-std">尚無數據</span>'}</div><div style="text-align:right;"><span class="bc-big">${curVal!=null?curVal.toFixed(f.dec):'—'}</span><span class="bc-unit">${f.unit}</span>${trendHTML}</div></div>${curVal!=null?buildRuler(fk,curVal):'<div style="color:var(--sub2);font-size:13px;margin:8px 0;">尚未記錄任何數據</div>'}<div><canvas id="tc-${fk}" height="80"></canvas></div>`;
      wrap.appendChild(card);
      setTimeout(()=>{
        const ctx=document.getElementById('tc-'+fk);if(!ctx)return;
        const labels=recs.map(r=>r.date.slice(5));
        const vals=recs.map(r=>r[fk]!=null?r[fk]:null);
        const vv=vals.filter(v=>v!=null);
        const mn=vv.length?Math.min(...vv)*0.97:0,mx=vv.length?Math.max(...vv)*1.03:10;
        const c=new Chart(ctx.getContext('2d'),{type:'line',data:{labels:labels.length?labels:['暫無'],datasets:[{data:vals.length?vals:[null],borderColor:color,backgroundColor:color+'22',tension:0.4,pointRadius:3,pointBackgroundColor:color,fill:true,borderWidth:2,spanGaps:true}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#e8e3dc'},ticks:{color:'#aaa',font:{size:9}}},y:{min:mn,max:mx,grid:{color:'#e8e3dc'},ticks:{color:'#aaa',font:{size:9}}}}}});
        tCharts.push(c);
      },0);
    });
  });
}

// ── STATS ──
function setPeriod(p,b){SP=p;document.querySelectorAll('.pbtn').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');renderStats();}
function renderStats(){
  const daily=localCache[CU].daily;
  const now=new Date(),ts=todayStr();
  let recs=Object.values(daily);
  if(SP==='today'){recs=recs.filter(r=>r.date===ts);}
  else if(SP==='week'){const w=new Date(now);w.setDate(w.getDate()-6);const ws=w.toISOString().slice(0,10);recs=recs.filter(r=>r.date>=ws);}
  else{const ms=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;recs=recs.filter(r=>r.date>=ms);}
  let tc=0,tp=0;const days=new Set();let gd=0,cd=0,sd=0;
  recs.forEach(r=>{days.add(r.date);(r.meals||[]).forEach(m=>(m||[]).forEach(x=>{tc+=x.cal||0;tp+=x.pro||0;}));if(r.exercise){if(r.exercise.gym)gd++;if(r.exercise.cardio)cd++;if(r.exercise.strength)sd++;}});
  const dc=days.size||1,pl=SP==='today'?'今日':SP==='week'?'本週（7天）':'本月';
  let html=`<div class="card"><div class="tsec" style="margin-bottom:12px;">熱量攝取</div><div class="bstat"><span class="bstat-lbl">總計</span><div><span class="bstat-val">${Math.round(tc)}</span><span class="bstat-unit">kcal</span></div></div>${SP!=='today'?`<div class="bstat"><span class="bstat-lbl">每日平均</span><div><span class="bstat-val">${Math.round(tc/dc)}</span><span class="bstat-unit">kcal/日</span></div></div>`:''}</div><div class="card"><div class="tsec" style="margin-bottom:12px;">蛋白質攝取</div><div class="bstat"><span class="bstat-lbl">總計</span><div><span class="bstat-val">${Math.round(tp)}</span><span class="bstat-unit">g</span></div></div>${SP!=='today'?`<div class="bstat"><span class="bstat-lbl">每日平均</span><div><span class="bstat-val">${Math.round(tp/dc)}</span><span class="bstat-unit">g/日</span></div></div>`:''}</div><div class="card"><div class="tsec" style="margin-bottom:12px;">運動（${pl}）</div><div class="srow"><span class="slbl">🏋️ 健身房</span><span class="sval">${gd} 天</span></div><div class="srow"><span class="slbl">🏃 有氧</span><span class="sval">${cd} 天</span></div><div class="srow"><span class="slbl">💪 肌力</span><span class="sval">${sd} 天</span></div></div><div class="card"><div class="tsec" style="margin-bottom:12px;">飲食明細</div>`;
  let any=false;
  recs.sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{
    let dh=`<div style="font-size:12px;font-weight:800;color:var(--sub);margin:10px 0 4px;">${r.date}</div>`;let hm=false;
    (r.meals||[]).forEach((meal,mi)=>{if(meal&&meal.length){hm=true;any=true;dh+=`<div style="font-size:11px;font-weight:700;color:${MC[mi]};margin:4px 0 2px;">${MEALS[mi]}</div>`;meal.forEach(x=>{dh+=`<div class="ftody"><div class="ftody-name">${x.name}</div><div class="ftody-mac">${x.cal||0} 大卡 · 蛋白質 ${x.pro||0}g</div></div>`;});}});
    if(hm)html+=dh;
  });
  if(!any)html+='<div class="tempty">此期間無飲食紀錄</div>';
  html+='</div>';
  document.getElementById('stats-content').innerHTML=html;
}

// ── START ──
window.addEventListener('db-ready', async()=>{
  document.getElementById('loading-overlay').style.display='none';
  await init();
});
setTimeout(()=>{
  const lo=document.getElementById('loading-overlay');
  if(lo.style.display!=='none'){
    lo.innerHTML='<div style="font-size:14px;color:#ef4444;font-weight:600;padding:20px;text-align:center;">連接失敗，請檢查網路後重新整理</div>';
  }
},10000);
</script>
